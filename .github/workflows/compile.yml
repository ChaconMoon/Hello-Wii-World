name: Compile Hello Wii World

on:
  push:
    branches: ["master"]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: run Makefile
        run: make
      
      - name: create package
        run: make package

      - name: upload package
        uses: actions/upload-artifact@v4
        with:
          name: test-upload
          path: ./dist/HelloWiiChaconMoon.zip